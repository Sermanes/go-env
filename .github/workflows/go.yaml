name: Go

on:
  push:
    branches: ["master"]
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache: true

      - name: Verify go.mod
        run: |
          go mod download
          go mod verify

      - name: go vet
        run: go vet ./...

      - name: Tests with race detector
        run: go test -race -v -failfast -short ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          args: --config .golangci.yml --timeout=5m
